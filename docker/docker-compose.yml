# =====================================================================
# docker-compose.yml —— 云购生活数仓 第 1 周环境编排
#
# 组件：
#   mysql            : 8.0，作为 Hive Metastore 的元数据库
#   hive-schematool  : 一次性初始化 Metastore 表结构（schematool -initSchema）
#   hive-metastore   : 9083，元数据服务
#   hive-server      : 10000(HiveServer2) / 10002，SQL 入口
#
# 启动：
#   cd docker
#   docker compose up -d
#   docker compose ps           # 四个容器状态
#   docker logs -f hive-schematool   # 第一次启动需要初始化 schema，看它是否成功
#
# 连接：
#   docker exec -it hive-server beeline -u jdbc:hive2://localhost:10000 -n hive
#
# 说明：
#   1. 启动顺序 mysql -> schematool -> metastore -> server 用 depends_on +
#      healthcheck 保证，避免「Metastore 未就绪导致 Hive 秒退」的经典问题。
#   2. hive-site.xml 通过卷挂载进容器，MySQL 连接串指向服务名 mysql（容器网络内）。
#   3. 数据目录 ../data 挂载到容器 /data，LOAD DATA LOCAL INPATH '/data/xxx.csv' 即可。
# =====================================================================

services:
  mysql:
    image: mysql:8.0
    container_name: ydsh-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: metastore
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # 一次性任务：初始化 Metastore 元数据表。成功退出后不再运行（docker compose ps 显示 Exited 0 属正常）
  hive-schematool:
    image: apache/hive:4.0.0
    container_name: ydsh-schematool
    depends_on:
      mysql:
        condition: service_healthy
    entrypoint: ["/opt/hive/bin/schematool"]
    command: ["-dbType", "mysql", "-initSchema", "--verbose"]
    environment:
      SERVICE_NAME: schematool
      DB_DRIVER: mysql
      IS_RESUME: "true"
    volumes:
      - ./hive-conf/hive-site.xml:/opt/hive/conf/hive-site.xml

  hive-metastore:
    image: apache/hive:4.0.0
    container_name: ydsh-hive-metastore
    depends_on:
      hive-schematool:
        condition: service_completed_successfully
    environment:
      SERVICE_NAME: metastore
      DB_DRIVER: mysql
      IS_RESUME: "true"
    ports:
      - "9083:9083"
    volumes:
      - ./hive-conf/hive-site.xml:/opt/hive/conf/hive-site.xml
      - hive-warehouse:/opt/hive/data/warehouse

  hive-server:
    image: apache/hive:4.0.0
    container_name: ydsh-hive-server
    depends_on:
      hive-metastore:
        condition: service_started
    environment:
      SERVICE_NAME: hiveserver2
      DB_DRIVER: mysql
      IS_RESUME: "true"
      HIVE_SERVER2_HEAPSIZE: 2048
    ports:
      - "10000:10000"
      - "10002:10002"
    volumes:
      - ./hive-conf/hive-site.xml:/opt/hive/conf/hive-site.xml
      - hive-warehouse:/opt/hive/data/warehouse
      - ../data:/data          # 原始 CSV 挂进容器，供 LOAD DATA LOCAL INPATH 使用
      - ../sql:/sql            # SQL 脚本挂进容器，便于在容器内直接执行

volumes:
  mysql-data:
  hive-warehouse:
